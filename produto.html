  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="index.html">
        <i class="bi bi-printer-fill me-2"></i>Gráfica VIP
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>

          <li class="nav-item">

            </a>
          </li>
        </ul>
      </div>
    </div>

  <!-- Main Content -->

      <nav aria-label="breadcrumb" class="mb-4">

        </ol>
      </nav>

      <!-- Loading -->
      <div class="text-center py-5" id="loadingState">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="mt-3 text-body-secondary">Carregando produto...</p>
      </div>

      <!-- Product Detail -->
      <div id="produtoDetalhe" class="d-none"></div>

      <!-- Related Products -->
      <section class="mt-5 pt-4 border-top d-none" id="relatedSection">

        </h4>
        <div class="row g-4" id="relatedGrid"></div>

  <footer class="py-4 bg-body-tertiary border-top">

      <div class="row align-items-center">
